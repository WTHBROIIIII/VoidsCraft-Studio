<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Error — VoidCraft Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #070910;
    --card: #0d1117;
    --border: #1e2535;
    --red: #f05a5a;
    --red-dim: #2e1212;
    --yellow: #ffd700;
    --yellow-dim: #332900;
    --text: #e8ecf4;
    --muted: #7a8499;
    --mono: 'JetBrains Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(240,90,90,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,90,90,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .wrap {
    max-width: 450px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 64px; height: 64px;
    background: var(--yellow-dim);
    border: 1px solid var(--yellow);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  .icon svg { width: 28px; height: 28px; color: var(--yellow); }
  h1 { font-size: 22px; font-weight: 700; color: var(--red); margin-bottom: 8px; }
  .code { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: left;
  }
  .card p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  .card .reason {
    background: var(--yellow-dim);
    border: 1px solid var(--yellow);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--yellow);
    margin-top: 12px;
    font-family: var(--mono);
    word-break: break-word;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--red); color: var(--red); }
  .btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </div>
  <h1>{{ title or 'Error' }}</h1>
  {% if error_code %}
  <div class="code">{{ error_code }}</div>
  {% endif %}
  <div class="card">
    <p>{{ message or 'An error occurred while processing your request.' }}</p>
    {% if details %}
    <div class="reason">{{ details }}</div>
    {% endif %}
  </div>
  <a href="/" class="btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Return to Login
  </a>
</div>
</body>
</html>
